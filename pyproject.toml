[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time simulation of a destination-dispatch elevator system with pluggable schedulers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Gregorovic" }]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]

[project.scripts]
elevator-sim = "elevator_sim.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elevator_sim"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scenarios"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
